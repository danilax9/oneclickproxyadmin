services:
  proxy-panel:
    build: .
    image: proxy-panel:latest
    container_name: proxy-panel
    restart: unless-stopped
    # host-режим нужен, чтобы прокси-порты, открываемые из админки,
    # сразу были доступны на сервере без пробрасывания каждого порта вручную.
    network_mode: host
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      PANEL_PORT: ${PANEL_PORT:-8000}
      SECRET_KEY: ${SECRET_KEY:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
    volumes:
      - proxy-data:/app/data
      - proxy-logs:/var/log/3proxy
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  proxy-data:
  proxy-logs:
